<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>관리자 대시보드 - AI Chatbot</title>
    <link rel="stylesheet" th:href="@{/css/demo.css}">
</head>

<body>
    <div class="container">
        <header>
            <a th:href="@{/demo}" class="back-link">← 홈으로</a>
            <h1>📊 관리자 대시보드</h1>
            <p class="subtitle">통계, 피드백 관리, CSV 내보내기</p>
        </header>

        <!-- 토큰 상태 -->
        <div id="tokenStatus" class="token-status"></div>

        <!-- 통계 -->
        <section class="stats-section">
            <h2>📈 활동 통계 (최근 24시간)</h2>
            <button onclick="loadStats()" class="btn btn-primary">통계 조회</button>
            <div id="statsResult" class="stats-cards"></div>
        </section>

        <!-- 피드백 목록 -->
        <section class="feedback-list-section">
            <h2>💬 피드백 목록</h2>
            <div class="filter-group">
                <select id="feedbackTypeFilter">
                    <option value="">전체</option>
                    <option value="true">👍 긍정</option>
                    <option value="false">👎 부정</option>
                </select>
                <button onclick="loadFeedbacks()" class="btn btn-secondary">조회</button>
            </div>
            <div id="feedbackList" class="feedback-list"></div>
        </section>

        <!-- 피드백 상태 변경 -->
        <section class="feedback-update-section">
            <h2>🔧 피드백 상태 변경</h2>
            <div class="form-inline">
                <div class="form-group">
                    <label for="feedbackId">피드백 ID</label>
                    <input type="number" id="feedbackId" placeholder="ID">
                </div>
                <div class="form-group">
                    <label for="newStatus">새 상태</label>
                    <select id="newStatus">
                        <option value="RESOLVED">✅ 해결됨</option>
                        <option value="PENDING">⏳ 대기중</option>
                    </select>
                </div>
                <button onclick="updateFeedbackStatus()" class="btn btn-primary">상태 변경</button>
            </div>
            <div id="updateResult" class="result-box"></div>
        </section>

        <!-- CSV 내보내기 -->
        <section class="export-section">
            <h2>📥 데이터 내보내기</h2>
            <p style="color: var(--text-muted); margin-bottom: 1rem;">최근 24시간 대화 데이터를 CSV로 다운로드합니다.</p>
            <button onclick="exportCsv()" class="btn btn-success">CSV 다운로드</button>
        </section>

        <footer>
            <p>ADMIN 권한이 필요합니다.</p>
        </footer>
    </div>

    <script>
        const API_BASE = '';

        document.addEventListener('DOMContentLoaded', () => {
            checkToken();
        });

        function checkToken() {
            const token = localStorage.getItem('accessToken');
            const statusDiv = document.getElementById('tokenStatus');
            if (token) {
                statusDiv.innerHTML = '<span class="status-ok">✅ 로그인됨 (ADMIN)</span>';
            } else {
                statusDiv.innerHTML = '<span class="status-error">❌ 로그인 필요 - <a href="/demo/login">로그인하기</a></span>';
            }
        }

        function getAuthHeaders() {
            const token = localStorage.getItem('accessToken');
            return {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
            };
        }

        // 통계 조회
        async function loadStats() {
            const resultDiv = document.getElementById('statsResult');
            resultDiv.innerHTML = '불러오는 중...';

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/stats`, {
                    headers: getAuthHeaders()
                });

                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="stat-card">
                            <div class="stat-value">${data.signupCount}</div>
                            <div class="stat-label">🆕 신규 가입</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.loginCount}</div>
                            <div class="stat-label">🔐 로그인</div>
                        </div>
                        <div class="stat-card">
                            <div class="stat-value">${data.chatCount}</div>
                            <div class="stat-label">💬 대화</div>
                        </div>
                    `;
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<div class="error">❌ ${error.message || '조회 실패'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 오류: ${error.message}</div>`;
            }
        }

        // 피드백 목록 조회
        async function loadFeedbacks() {
            const typeFilter = document.getElementById('feedbackTypeFilter').value;
            const listDiv = document.getElementById('feedbackList');

            listDiv.innerHTML = '불러오는 중...';

            let url = `${API_BASE}/api/v1/feedbacks?page=0&size=20`;
            if (typeFilter !== '') {
                url += `&isPositive=${typeFilter}`;
            }

            try {
                const response = await fetch(url, { headers: getAuthHeaders() });

                if (response.ok) {
                    const data = await response.json();
                    if (data.content && data.content.length > 0) {
                        let html = '<table class="data-table"><thead><tr><th>ID</th><th>타입</th><th>상태</th><th>Chat ID</th><th>생성일</th></tr></thead><tbody>';
                        data.content.forEach(fb => {
                            const typeIcon = fb.isPositive ? '👍' : '👎';
                            const typeText = fb.isPositive ? '긍정' : '부정';
                            const statusIcon = fb.status === 'RESOLVED' ? '✅' : '⏳';
                            html += `<tr onclick="document.getElementById('feedbackId').value='${fb.id}'" style="cursor:pointer">
                                <td>${fb.id}</td>
                                <td>${typeIcon} ${typeText}</td>
                                <td>${statusIcon} ${fb.status}</td>
                                <td>${fb.chatId}</td>
                                <td>${new Date(fb.createdAt).toLocaleString()}</td>
                            </tr>`;
                        });
                        html += '</tbody></table>';
                        html += '<p style="color: var(--text-muted); margin-top: 0.5rem; font-size: 0.85rem;">💡 행을 클릭하면 피드백 ID가 자동 입력됩니다.</p>';
                        listDiv.innerHTML = html;
                    } else {
                        listDiv.innerHTML = '<div class="info">피드백이 없습니다.</div>';
                    }
                } else {
                    const error = await response.json();
                    listDiv.innerHTML = `<div class="error">❌ ${error.message || '조회 실패'}</div>`;
                }
            } catch (error) {
                listDiv.innerHTML = `<div class="error">❌ 오류: ${error.message}</div>`;
            }
        }

        // 피드백 상태 변경
        async function updateFeedbackStatus() {
            const feedbackId = document.getElementById('feedbackId').value;
            const newStatus = document.getElementById('newStatus').value;
            const resultDiv = document.getElementById('updateResult');

            if (!feedbackId) {
                resultDiv.innerHTML = '<div class="error">피드백 ID를 입력해주세요.</div>';
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/v1/feedbacks/${feedbackId}/status`, {
                    method: 'PUT',
                    headers: getAuthHeaders(),
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    resultDiv.innerHTML = '<div class="success">✅ 상태가 변경되었습니다.</div>';
                    loadFeedbacks();
                } else {
                    const error = await response.json();
                    resultDiv.innerHTML = `<div class="error">❌ ${error.message || '변경 실패'}</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="error">❌ 오류: ${error.message}</div>`;
            }
        }

        // CSV 내보내기
        async function exportCsv() {
            const token = localStorage.getItem('accessToken');

            try {
                const response = await fetch(`${API_BASE}/api/v1/admin/reports/csv`, {
                    headers: { 'Authorization': `Bearer ${token}` }
                });

                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `chat_export_${new Date().toISOString().split('T')[0]}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    a.remove();
                } else {
                    alert('CSV 다운로드 실패');
                }
            } catch (error) {
                alert('오류: ' + error.message);
            }
        }
    </script>
</body>

</html>
